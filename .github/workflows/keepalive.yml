name: keepalive

on:
  schedule:
    # Fires daily, but scripts/keepalive.sh no-ops until the last commit is
    # older than ~50 days -- so it only commits when the repo is actually
    # nearing GitHub's 60-day scheduled-workflow inactivity cutoff, and daily
    # runs give ~10 days of retry margin. The odd minute avoids the heavily
    # contended top-of-hour slot GitHub is most likely to drop.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keepalive (commits only if the repo is going stale)
        run: |
          chmod +x ./scripts/keepalive.sh
          ./scripts/keepalive.sh
